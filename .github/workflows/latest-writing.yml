name: Latest writing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Refresh the essay list from sammii.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull in the newest essays
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://sammii.dev/rss.xml"
          max_post_count: 5
          template: "- [$title]($url), $date$newline"
          tag_post_pre_newline: true
          date_format: "d mmmm yyyy"
          commit_message: "Update latest writing"
          committer_username: "Sammii-HK"
          committer_email: "40900195+Sammii-HK@users.noreply.github.com"
